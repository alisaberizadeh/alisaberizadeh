name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    # Refresh the contribution snake once a day (UTC).
    - cron: "19 4 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alisaberizadeh
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%238B5CF6&color_dots=%23EBEDF0,%23DBEAFE,%2393C5FD,%236366F1,%237C3AED
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8&color_dots=%23161B33,%23253362,%234B56A8,%237C3AED,%23A855F7

      - name: Publish SVG files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
