    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1E9BFF"/><stop offset=".53" stop-color="#5865F2"/><stop offset="1" stop-color="#9A42DE"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#5B38D6" stop-opacity=".47"/><stop offset="1" stop-color="#5B38D6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#8091B0" stroke-opacity=".075" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
